version: '3.8'

services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: nti-frontend
    restart: unless-stopped
    working_dir: /app
    volumes:
      - .:/app:cached
      - frontend_node_modules:/app/node_modules
      - frontend_nuxt_cache:/app/.nuxt
    ports:
      - "3000:3000"
    environment:
      - NUXT_HOST=0.0.0.0
      - NUXT_PORT=3000
      - WATCHPACK_POLLING=true
    networks:
      - nti-network

networks:
  nti-network:
    external: true

volumes:
  frontend_node_modules:
  frontend_nuxt_cache: